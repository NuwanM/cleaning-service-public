<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CleanPro - Cleaning Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .checkbox-group {
      margin-top: 15px;
    }

    .checkbox-group input {
      margin-right: 10px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #2980b9;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1c5980;
    }

    #quote-result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #27ae60;
    }
  </style>
</head>
<body>

<header>
  <h1>CleanPro Cleaning Services</h1>
  <p>Get Your Free Quote Today!</p>
</header>

<div class="container">
  <h2>Request a Quote</h2>
  <form id="quote-form">
    <label for="rooms">Number of Rooms:</label>
    <input type="number" id="rooms" min="1" value="1">

    <label for="size">Total Size (in sq ft):</label>
    <input type="number" id="size" min="100" value="100">

    <label for="bathrooms">Number of Bathrooms:</label>
    <input type="number" id="bathrooms" min="1" value="1">

    <label for="frequency">Service Frequency:</label>
    <select id="frequency">
      <option value="one-time">One-Time Cleaning</option>
      <option value="weekly">Weekly Cleaning</option>
      <option value="biweekly">Bi-Weekly Cleaning</option>
    </select>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" id="deep-cleaning"> Deep Cleaning (+$50)
      </label>
      <label>
        <input type="checkbox" id="window-cleaning"> Window Cleaning (+$30)
      </label>
    </div>

    <button type="button" onclick="calculateQuote()">Calculate Quote</button>
  </form>

  <div id="quote-result"></div>
</div>

<script>
  function calculateQuote() {
    const rooms = parseInt(document.getElementById("rooms").value) || 0;
    const size = parseInt(document.getElementById("size").value) || 0;
    const bathrooms = parseInt(document.getElementById("bathrooms").value) || 0;
    const frequency = document.getElementById("frequency").value;
    const deepClean = document.getElementById("deep-cleaning").checked;
    const windowClean = document.getElementById("window-cleaning").checked;

    // Base rate per room and bathroom
    let baseRate = 0;

    // Base price based on house size
    if (size <= 500) baseRate = 100;
    else if (size <= 1000) baseRate = 150;
    else if (size <= 1500) baseRate = 200;
    else baseRate = 250;

    // Add extra for additional rooms and bathrooms
    baseRate += rooms * 10;
    baseRate += bathrooms * 15;

    // Apply frequency discount
    let freqDiscount = 1;
    if (frequency === "weekly") freqDiscount = 0.85; // 15% off
    else if (frequency === "biweekly") freqDiscount = 0.9; // 10% off

    let total = baseRate * freqDiscount;

    // Add optional services
    if (deepClean) total += 50;
    if (windowClean) total += 30;

    // Display result
    const resultDiv = document.getElementById("quote-result");
    resultDiv.innerHTML = `Estimated Total Cost: <strong>$${total.toFixed(2)}</strong>`;
  }
</script>

</body>
</html>
